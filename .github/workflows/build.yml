name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build the debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk stand.apk

      - uses: actions/upload-artifact@v4
        with:
          name: stand-apk
          path: stand.apk

      - name: Publish the APK as the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: stand.apk
