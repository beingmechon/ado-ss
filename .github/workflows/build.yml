name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # "true" when the repository has the signing secrets. See README, section "Signing key".
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Get the release key from the secrets
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "STAND_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the APKs
        env:
          STAND_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STAND_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STAND_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleLiteDebug :app:assembleFullDebug :app:assembleLiteRelease :app:assembleFullRelease

      - name: Select the APKs to publish
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            # Signed with the private release key.
            cp app/build/outputs/apk/lite/release/app-lite-release.apk stand.apk
            cp app/build/outputs/apk/full/release/app-full-release.apk stand-full.apk
          else
            # No release key: use the debug builds.
            cp app/build/outputs/apk/lite/debug/app-lite-debug.apk stand.apk
            cp app/build/outputs/apk/full/debug/app-full-debug.apk stand-full.apk
          fi

      - name: Delete the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: stand-apk
          path: |
            stand.apk
            stand-full.apk

      - name: Publish the APKs as the "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: |
            stand.apk
            stand-full.apk
